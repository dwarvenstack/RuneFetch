<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RuneFetch</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      background: #1E1812;
      color: #ECE1CF;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: #292019;
    }
    .header-logo  { font-size: 20px; }
    .header-title {
      font-size: 15px; font-weight: 700;
      background: linear-gradient(90deg, #E3A65A, #A7B388);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-sub { font-size: 10px; color: #7A6A58; margin-top: 1px; }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #17120D;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #7A6A58;
      flex-shrink: 0;
    }
    .dot.connected  { background: #6EC98A; }
    .dot.connecting { background: #E3A65A; animation: blink 1s infinite; }
    .dot.error      { background: #D96B5F; }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    #status-text { font-size: 11px; color: #7A6A58; flex: 1; }

    .section {
      padding: 10px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .section-label {
      font-size: 10px; color: #7A6A58;
      text-transform: uppercase; letter-spacing: .07em; margin-bottom: 6px;
      font-weight: 700;
    }

    .token-row { display: flex; gap: 6px; align-items: center; }
    #token-input {
      flex: 1;
      background: #17120D;
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 6px;
      color: #B8A894;
      font-size: 11px;
      padding: 5px 8px;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      letter-spacing: .03em;
      outline: none;
      transition: border-color 0.18s;
    }
    #token-input:focus { border-color: #E3A65A; }

    button {
      background: #332821;
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 6px;
      color: #B8A894;
      font-size: 12px;
      font-family: inherit;
      padding: 5px 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.18s, color 0.18s;
    }
    button:hover { background: #3E3028; color: #ECE1CF; }

    .btn-primary {
      background: #E3A65A;
      border: none;
      color: #2A1F12;
      font-weight: 700;
    }
    .btn-primary:hover { filter: brightness(1.08); background: #E3A65A; color: #2A1F12; }

    #btn-save  { font-size: 11px; padding: 5px 10px; }
    #btn-clear { font-size: 11px; padding: 5px 8px; color: #D96B5F; border-color: transparent; background: transparent; }
    #btn-clear:hover { background: rgba(217,107,95,0.12); color: #D96B5F; }

    .url-row { display: flex; gap: 6px; }
    #url-input {
      flex: 1;
      background: #17120D;
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 6px;
      color: #ECE1CF;
      font-size: 12px;
      padding: 5px 8px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.18s;
    }
    #url-input:focus { border-color: #E3A65A; }
    #url-input::placeholder { color: #4A3A28; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .toggle-label { font-size: 12px; color: #B8A894; }

    .toggle { position: relative; display: inline-block; width: 34px; height: 19px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #292019;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 19px;
      cursor: pointer;
      transition: 0.18s;
    }
    .slider::before {
      content: "";
      position: absolute;
      height: 13px; width: 13px;
      left: 2px; top: 2px;
      background: #7A6A58;
      border-radius: 50%;
      transition: 0.18s;
    }
    .toggle input:checked + .slider { background: #E3A65A; border-color: #E3A65A; }
    .toggle input:checked + .slider::before { transform: translateX(15px); background: #2A1F12; }

    .footer {
      padding: 8px 16px 10px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      background: #1E1812;
    }

    #msg {
      padding: 5px 16px;
      font-size: 11px;
      color: #6EC98A;
      min-height: 20px;
    }
    #msg.error { color: #D96B5F; }
    #msg.warn  { color: #E3A65A; }
  </style>
</head>
<body>

<div class="header">
  <span class="header-logo">⛩</span>
  <div>
    <div class="header-title">RuneFetch</div>
    <div class="header-sub">by DwarvenStack</div>
  </div>
</div>

<div class="status-row">
  <div class="dot" id="status-dot"></div>
  <span id="status-text">Checking…</span>
</div>

<div class="section">
  <div class="section-label">Token pairing</div>
  <div class="token-row">
    <input type="password" id="token-input" placeholder="Paste token from RuneFetch → Settings" autocomplete="off">
    <button id="btn-save">Save</button>
    <button id="btn-clear">✕</button>
  </div>
</div>

<div class="section">
  <div class="section-label">Send URL manually</div>
  <div class="url-row">
    <input type="url" id="url-input" placeholder="https://…">
    <button class="btn-primary" id="btn-send">↓ Send</button>
  </div>
</div>

<div class="toggle-row">
  <span class="toggle-label">Capture chip on pages</span>
  <label class="toggle">
    <input type="checkbox" id="chip-toggle" checked>
    <span class="slider"></span>
  </label>
</div>

<div id="msg"></div>

<div class="footer">
  <button id="btn-scan">Scan current tab</button>
</div>

<script src="popup.js"></script>
</body>
</html>
