<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RuneFetch</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: -apple-system, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #0d0f14;
      color: #c5cae3;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px 10px;
      border-bottom: 1px solid #1e2430;
    }
    .header-logo { font-size: 20px; }
    .header-title { font-size: 15px; font-weight: 700; color: #e0e4f8; }
    .header-sub   { font-size: 10px; color: #4a5070; margin-top: 1px; }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: #0a0c10;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4a5070;
      flex-shrink: 0;
    }
    .dot.connected  { background: #2dd4a0; }
    .dot.connecting { background: #ff9f0a; animation: blink 1s infinite; }
    .dot.error      { background: #ff6b6b; }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    #status-text { font-size: 12px; color: #8b92a8; flex: 1; }

    .section { padding: 10px 16px; border-bottom: 1px solid #1a1d28; }
    .section-label { font-size: 10px; color: #4a5070; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }

    .token-row { display: flex; gap: 6px; align-items: center; }
    #token-input {
      flex: 1;
      background: #12151f;
      border: 1px solid #1e2430;
      border-radius: 6px;
      color: #8b92a8;
      font-size: 11px;
      padding: 5px 8px;
      font-family: "Courier New", monospace;
      letter-spacing: .02em;
    }
    #token-input:focus { outline: none; border-color: #0099ff; }

    button {
      background: #1a1d28;
      border: 1px solid #1e2430;
      border-radius: 6px;
      color: #c5cae3;
      font-size: 12px;
      padding: 5px 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: #1e2330; }

    .btn-primary {
      background: linear-gradient(90deg, #00d9ff, #0099ff);
      border: none;
      color: #fff;
      font-weight: 600;
    }
    .btn-primary:hover { filter: brightness(1.1); }

    #btn-save  { font-size: 11px; padding: 5px 10px; }
    #btn-clear { font-size: 11px; padding: 5px 8px; color: #ff6b6b; }

    .url-row { display: flex; gap: 6px; }
    #url-input {
      flex: 1;
      background: #12151f;
      border: 1px solid #1e2430;
      border-radius: 6px;
      color: #c5cae3;
      font-size: 12px;
      padding: 5px 8px;
    }
    #url-input:focus { outline: none; border-color: #0099ff; }
    #url-input::placeholder { color: #3a4060; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
    }
    .toggle-label { font-size: 12px; color: #8b92a8; }

    /* simple toggle */
    .toggle { position: relative; display: inline-block; width: 32px; height: 18px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #1e2430;
      border-radius: 18px;
      cursor: pointer;
      transition: .2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      height: 12px; width: 12px;
      left: 3px; top: 3px;
      background: #4a5070;
      border-radius: 50%;
      transition: .2s;
    }
    .toggle input:checked + .slider { background: #0077cc; }
    .toggle input:checked + .slider::before { transform: translateX(14px); background: #fff; }

    .footer {
      padding: 8px 16px 10px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    #msg {
      padding: 5px 16px;
      font-size: 11px;
      color: #2dd4a0;
      min-height: 20px;
    }
    #msg.error { color: #ff6b6b; }
  </style>
</head>
<body>

<div class="header">
  <span class="header-logo">⛩</span>
  <div>
    <div class="header-title">RuneFetch</div>
    <div class="header-sub">Desktop download manager</div>
  </div>
</div>

<div class="status-row">
  <div class="dot" id="status-dot"></div>
  <span id="status-text">Checking…</span>
</div>

<div class="section">
  <div class="section-label">Token pairing</div>
  <div class="token-row">
    <input type="password" id="token-input" placeholder="Paste token from RuneFetch settings" autocomplete="off">
    <button id="btn-save">Save</button>
    <button id="btn-clear">✕</button>
  </div>
</div>

<div class="section">
  <div class="section-label">Send URL manually</div>
  <div class="url-row">
    <input type="url" id="url-input" placeholder="https://…">
    <button class="btn-primary" id="btn-send">Send</button>
  </div>
</div>

<div class="toggle-row">
  <span class="toggle-label">Capture chip on pages</span>
  <label class="toggle">
    <input type="checkbox" id="chip-toggle" checked>
    <span class="slider"></span>
  </label>
</div>

<div id="msg"></div>

<div class="footer">
  <button id="btn-scan">Scan current tab</button>
</div>

<script src="popup.js"></script>
</body>
</html>
